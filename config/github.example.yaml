# Copy this file into the GitHub Actions variable CUSTOM_CONFIG.
# Put actual credentials in Actions secrets, never in this public file.
zotero:
  user_id: ${oc.env:ZOTERO_ID}
  api_key: ${oc.env:ZOTERO_KEY}

email:
  sender_name: Daily Paper
  subject_prefix: Daily Paper
  max_width: 1120
  sender: ${oc.env:SENDER}
  receiver: ${oc.env:RECEIVER}
  sender_password: ${oc.env:SENDER_PASSWORD}
  smtp_server: smtp.qq.com # Change for your email provider.
  smtp_port: 465
  notes_collapsible: true # Native HTML disclosure; support varies by email client.

llm:
  enabled: true
  api:
    timeout: 90
    max_retries: 2
    key: ${oc.env:OPENAI_API_KEY}
    base_url: ${oc.env:OPENAI_API_BASE}
  api_mode: chat_completion
  language: Chinese
  generation_kwargs:
    model: YOUR_MODEL_NAME # Replace with your provider's model identifier.
    max_tokens: 3500
  reading_notes:
    enabled: true
    language: Chinese
    format_attempts: 2

source:
  arxiv:
    conversion_delay: 0
    category: [cs.AI, cs.LG, cs.CL, cs.CV, cs.IR, cs.NE, cs.MA, cs.RO, cs.SE, cs.DB, cs.DS, cs.DC, cs.CR]
    fetch_full_text: false # Notes fetch full text only after final selection.

executor:
  source: [arxiv]
  reranker: bm25
  max_paper_num: 3
  send_empty: false

recommendation:
  enabled: true
  interest_slots: 2
  explore_slots: 1
  min_interest_for_explore: 2
  fill_with_interest: true
  source_limits: {}
  source_weights: {}
  http:
    attempts: 3
    read_timeout: 30
    max_retry_delay: 30
  explore_include_topics:
    - >-
      natural language processing NLP linguistic text generation large language models
      language modeling LLM LLMs reasoning chain of thought retrieval augmented generation
      RAG question answering tokenization prompting instruction tuning alignment RLHF
      hallucination factuality language agents agentic tool use tool calling autonomous
      agents multi agent conversational dialogue chatbots code generation coding agents
  explore_exclude_topics:
    - >-
      computer vision visual image images video videos generation synthesis text to image
      text to video image editing camera scenes 3D reconstruction segmentation object
      detection world models rendering pixels depth motion robotics
    - biology medicine molecular protein physics quantum particles
  openalex:
    fields: [17] # Computer Science only.
