name: Embedding smoke test
on:
  workflow_dispatch:

jobs:
  embedding-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_CACHE: /tmp/daily-paper-model-cache
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: paper-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ vars.EMBEDDING_CACHE_VERSION }}
      - name: Verify upstream model on CPU (no email or private data)
        run: uv run --locked --extra embeddings pytest tests/reranker/test_local_reranker.py -m slow -q
