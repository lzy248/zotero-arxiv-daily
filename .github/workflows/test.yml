name: Test
on:
  workflow_dispatch:

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    env:
      HF_HUB_CACHE: /tmp/daily-paper-model-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      #  with:
      #    repository: ${{ vars.REPOSITORY }}
      #    ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock


      - name: Cache optional embedding weights
        if: vars.INSTALL_EMBEDDINGS == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.HF_HUB_CACHE }}
          key: paper-models-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ vars.EMBEDDING_CACHE_VERSION }}

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          INSTALL_EMBEDDINGS: ${{ vars.INSTALL_EMBEDDINGS }}
        run: |
          export DEBUG=true
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%s\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          if [ "$INSTALL_EMBEDDINGS" = "true" ]; then
            uv run --locked --no-dev --extra embeddings src/zotero_arxiv_daily/main.py
          else
            uv run --locked --no-dev src/zotero_arxiv_daily/main.py
          fi
